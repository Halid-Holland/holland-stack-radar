icrosoft 365",color:"#0078D4",base:!0,title:"Teams Guest Controls Update & Exchange Online Basic Auth Removal: September 1, 2026",date:"Jun 7, 2026",raw:"Microsoft Teams now allows admins to restrict shared channel invitations by domain allowlist and enforce conditional access for guests, rolling out by end of June. Separately, Microsoft will permanently remove Basic Authentication from Exchange Online on September 1, 2026. All admins must audit and migrate service accounts before this date."},{id:"atlassian",name:"Atlassian",color:"#0052CC",base:!0,title:"Jira: Advanced Roadmaps Moving to All Cloud Plans on July 1",date:"Jun 6, 2026",raw:"Atlassian is including Advanced Roadmaps in all Jira Software Cloud plans starting July 1. This adds cross-project roadmaps, dependency tracking, and capacity planning. Existing Premium customers keep full functionality with no action required."},{id:"cloudflare",name:"Cloudflare",color:"#E07514",base:!1,title:"Workers: Durable Objects Storage API v2 Now Generally Available",date:"Jun 5, 2026",raw:"Cloudflare Workers Durable Objects Storage API v2 is now GA with SQLite-backed storage, point-in-time recovery, and better read latency. Migration from the v1 storage API is required by December 2026."},{id:"accountingseed",name:"AccountingSeed",color:"#16803A",base:!1,title:"v10.6: ASC 606 Revenue Recognition Automation Released",date:"Jun 3, 2026",raw:"AccountingSeed v10.6 adds automated ASC 606 revenue recognition for multi-element arrangements: performance obligation tracking, standalone selling price allocation, and automated journal entry generation. Requires Salesforce Spring 25. Finance admin reconfiguration required post-upgrade."},{id:"openai",name:"OpenAI",color:"#10A37F",base:!0,title:"GPT-4o: Vision API Enhancements and 25% Input Price Reduction",date:"Jun 5, 2026",raw:"OpenAIs GPT-4o API now supports real-time multimodal vision analysis with improved latency. Input token pricing reduced by 25%. Structured Outputs now handles complex nested schemas for production integrations. Batch API access is now available to all tiers."},{id:"anthropic",name:"Anthropic",color:"#C35D38",base:!0,title:"Claude 4 Opus: 500k Context Window and Computer Use Now GA",date:"Jun 3, 2026",raw:"Anthropic released Claude 4 Opus with a 500k token context window and improved multi-step reasoning. Computer Use is now generally available for all API tiers. New prompt caching reduces latency and cost for repeated context. Claude.ai for Teams adds SAML 2.0 SSO and admin audit logging."},{id:"github",name:"GitHub",color:"#24292F",base:!1,title:"GitHub Actions: Larger Runners and Copilot PR Summaries for Teams Plan",date:"Jun 6, 2026",raw:"GitHub Actions now offers larger runner tiers with up to 64 vCPUs. The dependency review action can now automatically block PRs with critical CVEs. Copilot for pull requests is available on Team and Enterprise plans with auto-generated PR summaries."},{id:"logik",name:"Logik.io",color:"#2563EB",base:!0,title:"Logik CPQ: Spring 25 Compatibility Patch and 30% Quote Performance Improvement",date:"Jun 2, 2026",raw:"Logik.io released compatibility updates for Salesforce Spring 25, resolving known issues with the updated Flow runtime. Quote generation for large configurations is approximately 30% faster. A new admin dashboard provides real-time visibility into CPQ rule execution and error logging."},{id:"gearset",name:"Gearset",color:"#6C2BD9",base:!1,title:"Gearset v2.8: Automated Org Monitoring and Jira Webhook Trigger",date:"Jun 4, 2026",raw:"Gearset v2.8 adds automated org monitoring that alerts on unexpected metadata changes in production. Backup comparison now includes visual Flow metadata diffs. CI/CD pipelines can now be triggered directly from Jira issue transitions via a new webhook integration."},{id:"sentry",name:"Sentry",color:"#362D59",base:!1,title:"Sentry: Unified Performance Dashboard and Vercel Source Map Auto-Upload",date:"May 28, 2026",raw:"Sentrys new Performance Monitoring dashboard consolidates Core Web Vitals, API latency, and error rates. Source map auto-upload integrates with Vercel deployments out of the box. Session Replay retention extended to 30 days on all paid plans."},{id:"zoominfo",name:"ZoomInfo",color:"#F97316",base:!1,title:"ZoomInfo: New Manufacturing Intent Signals and Real-Time Salesforce Sync",date:"May 30, 2026",raw:"ZoomInfo added 15 new intent signals for B2B manufacturing verticals. Salesforce integration now supports real-time Account and Contact enrichment on record creation. Duplicate detection improvements address known issues with custom deduplication rule configurations."},{id:"slack",name:"Slack",color:"#4A154B",base:!1,title:"Slack: Workflow Builder Conditional Logic and Updated Salesforce App",date:"Jun 5, 2026",raw:"Slacks Workflow Builder now supports conditional branching and multi-step automations without code. The Salesforce for Slack app was updated with real-time record notifications and inline record editing. Enterprise Grid now includes expanded DLP controls for compliance teams."},{id:"zoom",name:"Zoom",color:"#2D8CFF",base:!1,title:"Zoom: AI Companion 2.0 and Meeting Summary Enhancements",date:"Jun 3, 2026",raw:"Zoom AI Companion 2.0 adds real-time coaching suggestions during meetings and improved meeting summary accuracy. Teams plan now includes 30-hour meeting recording retention. New admin controls allow IT to restrict AI features by department or user group."},{id:"docusign",name:"DocuSign",color:"#FF6B00",base:!1,title:"DocuSign: Salesforce Integration Update and Bulk Send Improvements",date:"Jun 1, 2026",raw:"DocuSigns Salesforce integration now supports bulk envelope sending from list views. eNotary support expanded to 5 additional US states. API rate limits increased 40% for Enterprise plans. Webhook reliability improvements reduce missed event delivery."},{id:"tableau",name:"Tableau",color:"#E97627",base:!1,title:"Tableau: Pulse Anomaly Detection and Salesforce Data Cloud Int
