name: Weekly Stack Digest

on:
  schedule:
    - cron: '0 13 * * 1'  # Every Monday 8:00 AM CT (13:00 UTC)
  workflow_dispatch:
    inputs:
      run_mode:
        description: 'Run mode'
        required: false
        default: 'mock'
        type: choice
        options:
          - mock
          - test
          - production

jobs:
  run-digest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run digest
        env:
          RUN_MODE:             ${{ github.event.inputs.run_mode || 'production' }}
          GEMINI_API_KEY:       ${{ secrets.GEMINI_API_KEY }}
          ENTRA_CLIENT_ID:      ${{ secrets.ENTRA_CLIENT_ID }}
          ENTRA_TENANT_ID:      ${{ secrets.ENTRA_TENANT_ID }}
          ENTRA_CLIENT_SECRET:  ${{ secrets.ENTRA_CLIENT_SECRET }}
          MAIL_FROM:            ${{ secrets.MAIL_FROM }}
          MAIL_TO:              ${{ secrets.MAIL_TO }}
        run: node scripts/run-digest.js

      - name: Commit last-run timestamp
        if: ${{ (github.event.inputs.run_mode || 'production') == 'production' }}
        run: |
          if [ -n "$(git status --porcelain last-run.json)" ]; then
            git config user.name "stack-radar-bot"
            git config user.email "actions@github.com"
            git add last-run.json
            git commit -m "Update last-run timestamp [skip ci]"
            git push
          fi
