name: Weekly Stack Digest

permissions:
  contents: write

on:
  schedule:
    - cron: '*/15 * * * *'  # Checks every 15 min for automations due right now (run-digest.js does the actual matching)
  workflow_dispatch:
    inputs:
      run_mode:
        description: 'Run mode'
        required: false
        default: 'mock'
        type: choice
        options:
          - mock
          - test
          - production
          - automations

jobs:
  run-digest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      # Coarse pre-filter: on a scheduled run, skip entirely if there isn't even one
      # non-paused automation saved. The real due-time (day/time) matching happens
      # inside run-digest.js - this just avoids running node at all when there's
      # nothing to possibly check.
      - name: Check for active automations
        id: check
        if: github.event_name == 'schedule'
        run: |
          HAS_ACTIVE=$(node -e "const a=require('./automations.json');console.log(a.some(x=>!x.paused)?'true':'false')")
          echo "has_active=$HAS_ACTIVE" >> "$GITHUB_OUTPUT"

      - name: Run digest
        id: rundigest
        if: github.event_name == 'workflow_dispatch' || steps.check.outputs.has_active == 'true'
        env:
          RUN_MODE:             ${{ github.event.inputs.run_mode || 'production' }}
          GEMINI_API_KEY:       ${{ secrets.GEMINI_API_KEY }}
          ENTRA_CLIENT_ID:      ${{ secrets.ENTRA_CLIENT_ID }}
          ENTRA_TENANT_ID:      ${{ secrets.ENTRA_TENANT_ID }}
          ENTRA_CLIENT_SECRET:  ${{ secrets.ENTRA_CLIENT_SECRET }}
          MAIL_FROM:            ${{ secrets.MAIL_FROM }}
          MAIL_TO:              ${{ secrets.MAIL_TO }}
        run: node scripts/run-digest.js

      - name: Commit updated schedule state
        if: steps.rundigest.outcome == 'success'
        run: |
          CHANGED=""
          if [ -f last-run.json ] && [ -n "$(git status --porcelain last-run.json)" ]; then
            CHANGED="$CHANGED last-run.json"
          fi
          if [ -n "$(git status --porcelain automations.json)" ]; then
            CHANGED="$CHANGED automations.json"
          fi
          if [ -n "$CHANGED" ]; then
            git config user.name "stack-radar-bot"
            git config user.email "actions@github.com"
            git add $CHANGED
            git commit -m "Update digest run state [skip ci]"
            git push
          fi
