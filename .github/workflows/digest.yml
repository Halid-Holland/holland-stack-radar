name: Weekly Stack Digest

on:
  schedule:
    - cron: '0 13 * * 1'  # Every Monday 8:00 AM CT (13:00 UTC)
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Test mode — run 1 vendor only'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

jobs:
  run-digest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run digest
        env:
          GEMINI_API_KEY:       ${{ secrets.GEMINI_API_KEY }}
          ENTRA_CLIENT_ID:      ${{ secrets.ENTRA_CLIENT_ID }}
          ENTRA_TENANT_ID:      ${{ secrets.ENTRA_TENANT_ID }}
          ENTRA_CLIENT_SECRET:  ${{ secrets.ENTRA_CLIENT_SECRET }}
          MAIL_FROM:            ${{ secrets.MAIL_FROM }}
          MAIL_TO:              ${{ secrets.MAIL_TO }}
          TEST_MODE:            ${{ github.event.inputs.test_mode || 'false' }}
        run: node scripts/run-digest.js
